{% set name = "ibmpairs" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: efaf67361a0487f3ca1e23f7cc8f3a38dd7a0bc217479c6e24936e73d9b79b1d

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - fs
    - future
    - futures
    - jsonschema
    - numpy
    - pandas
    - pillow >=1.6
    - python >={{ python_min }}
    - pytz
    - requests >=2.4
    - shapely

test:
  requires:
    - python {{ python_min }}
  imports:
    - ibmpairs
about:
  home: https://ibmpairs.mybluemix.net
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: open source Python modules for the IBM PAIRS Geoscope platform
  doc_url: https://pairs.res.ibm.com/tutorial/
  dev_url: https://github.com/ibm/ibmpairs

extra:
  recipe-maintainers:
    - cmalbrec
